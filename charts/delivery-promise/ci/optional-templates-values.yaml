# Used by `helm lint` / `ct lint`: every optional template enabled at once (HPA,
# Ingress, Gateway API HTTPRoute) and every optional config value set, so every
# env var cmd/api can read is rendered.
database:
  existingSecret: "delivery-promise-db"
config:
  eventPublisher: "kafka"
  consumerGroup: "delivery-promise-consumer"
  outboxRelayInterval: "500ms"
  outboxMaxAttempts: 20
  sweepInterval: "15s"
  shutdownDrainDelay: "5s"
  logLevel: "info"
kafka:
  brokers: "kafka.example.invalid:9092"
ingress:
  enabled: true
gatewayApi:
  enabled: true
  parentRefs:
    - name: example-gateway
      namespace: gateway
      sectionName: http
  hosts:
    - path: /api/delivery-promise
      pathType: PathPrefix
autoscaling:
  api:
    enabled: true
