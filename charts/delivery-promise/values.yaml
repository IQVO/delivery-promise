# Default values for delivery-promise.

replicaCount: 1

# The tag defaults to the chart's appVersion (the release job packages the chart
# with --app-version = the image tag it just published). Override repository and
# tag for a locally built image.
image:
  repository: ghcr.io/iqvo/delivery-promise
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid 1000 (USER 1000) and writes nothing to disk, so the root
# filesystem is read-only and no volume is mounted.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure of the REST API, both OFF by default. They route to this
# chart's only Service (the api).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: delivery-promise.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the api Deployment, OFF by
# default. When enabled the Deployment omits replicas so the HPA owns them.
# N>1 is safe for the outbox relay (FOR UPDATE SKIP LOCKED), the version-guarded
# aggregate writes and the consumer (stable group, inbox dedupe on the CloudEvents
# id in the same transaction); it has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (config.go, main.go, workers.go). Every key maps
# 1:1 to one env var; the chart renders exactly the variables the binary reads.
config:
  httpAddr: ":8080"                  # HTTP_ADDR (keep service.targetPort in step)
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # EVENT_PUBLISHER: "kafka" is the only publisher; the log sink does not
  # exist. Any other value is refused at render and by the binary at boot.
  eventPublisher: "kafka"
  # DELIVERY_PROMISE_CONSUMER_GROUP: the STABLE group id of the one consumer
  # over the eight producing contexts, so a rescheduled pod resumes from its
  # committed offsets. REQUIRED (empty = the chart refuses to render, the binary
  # refuses to boot). Service-prefixed, for example "delivery-promise-consumer";
  # never the pod name.
  consumerGroup: ""
  # OUTBOX_MAX_ATTEMPTS: how many times one outbox row may fail before the relay
  # excludes it from claims, so a poison row cannot block the relay forever.
  # 0 = unlimited.
  outboxMaxAttempts: 20
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds. Empty =
  # not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # SWEEP_INTERVAL: how often the sweeper runs ExpireOffers, ReleaseExpiredHolds,
  # CloseBooks and RepriceAtRisk. Empty = not rendered; the binary defaults to 15s.
  sweepInterval: ""
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the listener
  # (Go duration, "0" disables). Empty = not rendered; the binary defaults to 5s.
  # The grace period below must exceed it plus 40s.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. Postgres is the only runtime: cmd/api has no in-memory mode and exits at
# boot without DATABASE_URL. DATABASE_URL always comes from a Secret
# (secretKeyRef), never from the ConfigMap.
database:
  # A DSN the chart stores in its own Secret. Prefer existingSecret in a real
  # cluster so the DSN never passes through values.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same secret, of a DIRECT (non-pooled, session-mode) connection
  # string used ONLY for the golang-migrate startup step, never for the runtime
  # pool. golang-migrate takes a session-scoped advisory lock that a transaction
  # pooler cannot honour. Rendered with `optional: true`: a secret without the
  # key still starts the pod and the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  # With database.url (chart-owned Secret) only: the direct DSN stored under
  # migrationsExistingSecretKey. Empty = the key is not created.
  migrationsUrl: ""

# Kafka is the only runtime: KAFKA_BROKERS is MANDATORY (comma-separated) and
# always rendered (outbox relay, consumer, /readyz broker check). Produced
# topics: retailnetwork.delivery-promise.events and .analytics. Consumed: the
# integration topics of customer-ordering, order-sourcing, shipping-and-tracking,
# linehaul-transportation, last-mile-delivery, node-performance, node-topology
# and offer-availability, all through one consumer group (config.consumerGroup).
kafka:
  brokers: ""

# Observability (ADR 0009): the fleet pipeline is pod --OTLP/gRPC--> Collector
# --> Jaeger (traces) and Prometheus (metrics); logs are stdout JSON for Alloy
# and Loki. Export never blocks, so a Collector that is down costs telemetry and
# nothing else, but otel.enabled=false renders no OTEL_* env at all (the binaries
# then fall back to localhost:4317). serviceName is OTEL_SERVICE_NAME of the api;
# the mcp component gets "<serviceName>-mcp". SERVICE_VERSION is the image tag
# (appVersion when empty), ENVIRONMENT is `environment`.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "delivery-promise"

# ENVIRONMENT of the api: deployment.environment.name on every span, metric and
# log of the api. (mcp.environment overrides it for the mcp component.)
environment: "production"

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable, EVENT_PUBLISHER other than "kafka", and any variable that
# has a dedicated value above.
extraEnv: []

# The Postgres dial (migrations + ping) at boot is wrapped in a bounded retry
# (internal/bootretry), so startupProbe gives the pod about a minute before the
# kubelet gives up. Once it succeeds, liveness takes over; readiness uses
# /readyz (drain gate + Postgres ping + Kafka metadata), which flips to
# not-ready as the FIRST step of the graceful shutdown.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown: SHUTDOWN_DRAIN_DELAY
# (default 5s) + HTTP drain (10s) + consumer drain (10s) + sweeper drain (10s) +
# outbox relay drain (10s, stopped LAST) = 45s worst case. The chart refuses a
# value that does not EXCEED drain delay + 40: a shorter grace period SIGKILLs
# the consumer or the relay mid-drain.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Optional components (ADR 0007 MCP, ADR 0010 A2A, ADR 0008 web remote). All are OFF by
# default: a default render is the api alone.
# ---------------------------------------------------------------------------

# cmd/mcp (ADR 0007): the read-only MCP server (Streamable HTTP on /mcp plus
# an open /healthz). It reads the service database through the same use
# cases as the API and writes nothing: no outbox relay, no consumer, no
# sweeper, no Kafka. No auth, by fleet decision: the in-cluster ClusterIP
# boundary is the access control.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR (keep mcp.service.targetPort in step)
  # SERVICE_VERSION (default: the image tag) / ENVIRONMENT (default: the
  # top-level `environment`): service.version and deployment.environment.name
  # of the mcp component, also reported in the boot log line.
  serviceVersion: ""
  environment: ""
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure: /api/mcp/delivery-promise -> Service :8090, prefix
  # rewritten to /mcp. Needs the Gateway parentRef from warehouse-infra.
  route:
    enabled: false
    path: "/api/mcp/delivery-promise"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# cmd/a2a (docs/adr/0010): the read-only A2A (Agent2Agent) agent, a third
# driving adapter over the SAME read use cases as the REST and MCP surfaces
# (JSON-RPC 2.0 on / and /a2a, Agent Card at /.well-known/agent-card.json,
# an open /healthz). Skills: promise_status and book_capacity, both reads: the
# MCP charter (ADR 0007) is read-only, so the agent writes nothing and has no
# outbox relay, consumer, sweeper or Kafka. A2A carries delegation only; facts
# between contexts still travel as CloudEvents. No auth, by fleet decision: the
# in-cluster ClusterIP boundary is the access control. Off by default;
# warehouse-infra turns it on.
a2a:
  enabled: false
  replicaCount: 1
  httpAddr: ":8093"                  # A2A_ADDR (keep a2a.service.targetPort in step; 8080 api, 8090 mcp)
  # Absolute URL advertised on the Agent Card (A2A_AGENT_URL). Empty defaults
  # to this release's in-cluster Service DNS
  # (http://<release>-a2a.<namespace>.svc.cluster.local:8093/); warehouse-infra
  # can override it with the Kong URL when the agent must be reachable
  # off-cluster.
  agentUrl: ""
  # SERVICE_VERSION (default: the image tag) / ENVIRONMENT (default: the
  # top-level `environment`): service.version (also the Agent Card version)
  # and deployment.environment.name of the a2a component.
  serviceVersion: ""
  environment: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Kong exposure: /api/a2a/delivery-promise -> Service :8093, prefix
  # rewritten to / (the JSON-RPC root; the well-known agent card stays
  # reachable under the same prefix). Needs the Gateway parentRef from
  # warehouse-infra.
  route:
    enabled: false
    path: "/api/a2a/delivery-promise"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# web/ (delivery_promise_mfe, ADR 0008): the Module Federation remote served
# by its own nginx pod, reached through warehouse-infra's Nginx web gateway
# at /mfes/delivery-promise/. Never routed by this chart; ClusterIP only.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/delivery-promise-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
