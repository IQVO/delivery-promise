{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "delivery-promise.mcpFullname" . }}
  labels:
    {{- include "delivery-promise.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  # ClusterIP only, always: access control is the in-cluster boundary (no
  # auth, fleet decision); exposure beyond the cluster is the optional
  # mcp-route.yaml.
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "delivery-promise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
