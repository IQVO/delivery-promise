{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "delivery-promise.databaseSecretName" . }}
  labels:
    {{- include "delivery-promise.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- if and .Values.database.migrationsUrl .Values.database.migrationsExistingSecretKey }}
  {{ .Values.database.migrationsExistingSecretKey }}: {{ .Values.database.migrationsUrl | quote }}
  {{- end }}
{{- end }}
