{{- if .Values.a2a.enabled }}
{{- include "delivery-promise.requireDatabase" . -}}
{{- include "delivery-promise.requireCleanA2AExtraEnv" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delivery-promise.a2aFullname" . }}
  labels:
    {{- include "delivery-promise.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "delivery-promise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "delivery-promise.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "delivery-promise.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "delivery-promise.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/a2a/main.go: A2A_ADDR,
          # A2A_AGENT_URL, LOG_LEVEL, SERVICE_VERSION, ENVIRONMENT,
          # OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, DATABASE_URL and
          # (migration step only) MIGRATIONS_DATABASE_URL. cmd/a2a has no
          # auth env, starts no outbox relay, runs no consumer and no
          # sweeper, and never dials Kafka (no KAFKA_BROKERS, no consumer
          # group, no EVENT_PUBLISHER here): the agent is read-only.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # The Agent Card advertises this absolute URL, so it must be one
            # the fleet's agent clients can dial: the release's in-cluster
            # Service DNS by default, overridable (a2a.agentUrl) with the
            # gateway URL when the agent must be reachable off-cluster.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "delivery-promise.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.a2a.serviceVersion | default .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.a2a.environment | default .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "delivery-promise.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/a2a runs the idempotent embedded migrations on start (like
            # the api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "delivery-promise.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/a2a, so the probes have a cheap
          # target. /readyz is an api concern (its consumer dials Kafka);
          # the A2A agent only reads Postgres and needs no drain gate, so
          # readiness is the same /healthz.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
