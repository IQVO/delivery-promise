                $ref: '#/components/schemas/Confidence'
              policyVersion: *id001
              expiresAt: *id002
              capacityBand:
                type: string
                enum:
                - AMPLE
                - TIGHT
                - SCARCE
                description: 'The capacity pressure on the PromiseBook the offer''s window would charge, read at quote time
                  (ADR 0023): AMPLE below 60% of the share used by provisional plus confirmed holds, TIGHT from 60% to below
                  85%, SCARCE from 85%. Optional and additive; omitted when the book has no finite capacity, never an empty
                  string. Consumers decode tolerantly and ignore it.'
    PromisePolicyPublishedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - policyVersion
            - version
            - offerTtlMinutes
            - holdTtlMinutes
            - packagesPerOrder
            - capacitySharePercent
            - transitWindowDays
            - transitServiceLevelPercent
            - minTransitObservations
            - targetOnTimeProbabilityPercent
            - minCalibrationObservations
            - calibrationWindowDays
            - maxCalibrationBufferMinutes
            - orderDeadlines
            - publishedAt
            properties:
              policyVersion: *id001
              version:
                type: integer
                minimum: 1
              offerTtlMinutes: &id003
                type: integer
              holdTtlMinutes: *id003
              packagesPerOrder: *id003
              capacitySharePercent: *id003
              transitWindowDays:
                type: integer
                minimum: 1
                maximum: 365
                description: Days of observed transits the measured-transit read model keeps (ADR 0014).
              transitServiceLevelPercent:
                type: integer
                minimum: 50
                maximum: 99
                description: Service-level percentile quoted against measured transit (ADR 0014).
              minTransitObservations:
                type: integer
                minimum: 5
                maximum: 1000
                description: Observations a lane needs before its measured transit beats the timetable (ADR 0014).
              targetOnTimeProbabilityPercent:
                type: integer
                minimum: 50
                maximum: 99
                description: Share of the promises of a calibration segment the buffer aims to deliver on time; one value
                  for every tier (ADR 0020).
              minCalibrationObservations:
                type: integer
                minimum: 10
                maximum: 10000
                description: Judgements a segment needs inside the window before its buffer applies (ADR 0020).
              calibrationWindowDays:
                type: integer
                minimum: 1
                maximum: 365
                description: Days of judgements a calibration segment keeps (ADR 0020).
              maxCalibrationBufferMinutes:
                type: integer
                minimum: 0
                maximum: 2880
                description: Cap of a segment's buffer in minutes; 0 switches the buffer off (ADR 0020).
              orderDeadlines:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDeadline'
              publishedAt: *id002
