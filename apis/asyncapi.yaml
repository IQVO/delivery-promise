components:
  messages:
    PromiseMade:
      name: PromiseMade
      title: Promise made
      summary: A provisional promise was made for one shipment group and capacity was held.
      contentType: application/cloudevents+json
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseMade`; `dataschema` = `urn:retailnetwork:delivery-promise:analytics:PromiseMade:v1`;
        subject and key = the promiseId. Topic: retailnetwork.delivery-promise.analytics. Raised by MakePromise. ANALYTICS
        ONLY (model: consumers analytics only). The offer is CONSUMED and the book hold taken in the same transaction. `lines`
        always has at least one entry.'
      tags:
      - name: promise
      payload:
        $ref: '#/components/schemas/PromiseMadeEvent'
      examples:
      - name: promiseMade
        summary: A provisional promise was made for one shipment group and capacity was held.
        payload:
          specversion: '1.0'
          id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0001
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseMade
          subject: prm-7f3a21
          time: '2026-10-22T19:09:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:analytics:PromiseMade:v1
          data:
            promiseId: prm-7f3a21
            offerId: off-19c4d0
            tier: NEXT_DAY
            nodeId: N-VWS-AUS3
            pickupDepartureId: dep-AUS3-1800
            shipBy: '2026-10-22T23:00:00Z'
            deliverByEarliest: '2026-10-23T14:00:00Z'
            deliverByLatest: '2026-10-24T02:00:00Z'
            timeZone: America/Chicago
            basis: SCHEDULED
            policyVersion: v3
            holdExpiresAt: '2026-10-22T19:24:00Z'
            lines:
            - catalogItemId: ci-1001
              quantity: 2
    PromiseConfirmed:
      name: PromiseConfirmed
      title: Promise confirmed
      summary: A provisional promise became CONFIRMED for a placed order.
      contentType: application/cloudevents+json
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseConfirmed`; `dataschema` = `urn:retailnetwork:delivery-promise:analytics:PromiseConfirmed:v1`;
        subject and key = the promiseId. Topic: retailnetwork.delivery-promise.analytics. Raised by ConfirmPromise (the synchronous
        POST /promises/{promiseId}:confirm that customer-ordering calls inside checkout, or the reconciling consumer of CustomerOrderPlaced).
        ANALYTICS ONLY. A repeated confirm raises nothing.'
      tags:
      - name: promise
      payload:
        $ref: '#/components/schemas/PromiseConfirmedEvent'
      examples:
      - name: promiseConfirmed
        summary: A provisional promise became CONFIRMED for a placed order.
        payload:
          specversion: '1.0'
          id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0002
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseConfirmed
          subject: prm-7f3a21
          time: '2026-10-22T19:10:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:analytics:PromiseConfirmed:v1
          data:
            promiseId: prm-7f3a21
            orderId: ord-55a901
            groupNo: 1
    PromiseAtRisk:
      name: PromiseAtRisk
      title: Promise at risk
      summary: A confirmed promise's witness path stopped being feasible.
      contentType: application/cloudevents+json
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk`; `dataschema` = `urn:retailnetwork:delivery-promise:events:PromiseAtRisk:v1`;
        subject and key = the promiseId. Topic: retailnetwork.delivery-promise.events. Raised by FlagPromiseAtRisk (RepromiseOnRisk)
        on FulfillmentUnsourceable, PackageExceptionRaised, PackageInductionDeferred, DepartureCancelled, DeliveryWaveCancelled,
        BookingFailed or BookingMoved affecting the witness path. Consumed by customer-ordering. `reason` is one of NODE_UNSOURCEABLE,
        PACKAGE_EXCEPTION, INDUCTION_DEFERRED, DEPARTURE_CANCELLED, WAVE_CANCELLED, BOOKING_FAILED, BOOKING_MOVED.'
      tags:
      - name: promise
      payload:
        $ref: '#/components/schemas/PromiseAtRiskEvent'
      examples:
      - name: promiseAtRisk
        summary: A confirmed promise's witness path stopped being feasible.
        payload:
          specversion: '1.0'
          id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0003
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk
          subject: prm-7f3a21
          time: '2026-10-22T21:40:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseAtRisk:v1
          data:
            promiseId: prm-7f3a21
            orderId: ord-55a901
            reason: DEPARTURE_CANCELLED
            detectedAt: '2026-10-22T21:40:00Z'
    PromiseRevised:
      name: PromiseRevised
      title: Promise revised
      summary: A promise moved to a later window (re-promise), never earlier.
      contentType: application/cloudevents+json
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseRevised`; `dataschema` = `urn:retailnetwork:delivery-promise:events:PromiseRevised:v1`;
        subject and key = the promiseId. Topic: retailnetwork.delivery-promise.events. Raised by RevisePromise (RepromiseOnRisk).
        `revisionNo` strictly increases per promise from 1. Consumed by customer-ordering (shows the new window) and order-sourcing
        (FulfillmentConstraintRevised). `deliverByLatest` is never earlier than `previousDeliverByLatest`. `nodeId` is the
