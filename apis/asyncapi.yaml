  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          const: /retailnetwork/delivery-promise
        type: &id001
          type: string
        subject:
          type: string
          description: The aggregate root id (promiseId, bookId, offerId or policyVersion).
        time: &id002
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema: *id001
    ConsumedEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - time
      - data
      description: 'Tolerant envelope of a consumed event: only the attributes the consumer relies on.'
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source: *id001
        type: *id001
        subject: *id001
        time: *id002
        datacontenttype: *id001
        dataschema: *id001
    Tier:
      type: string
      enum:
      - SAME_DAY
      - NEXT_DAY
      - TWO_DAY
      - STANDARD
    Basis:
      type: string
      description: 'Promise basis: SCHEDULED from the timetable, MEASURED when a leg''s measured transit pushed the
        arrival later (ADR 0014), NOMINAL from lane times (STANDARD only).'
      enum:
      - SCHEDULED
      - MEASURED
      - NOMINAL
    Confidence:
      type: number
      minimum: 0
      maximum: 1
      multipleOf: 0.001
      description: The calibrated probability, rounded to three decimals, that the quote is kept on time (ADR 0020),
        which is the share of the judged promises of its segment (tier, basis, node grade) whose lateness was within the buffer
        the quote carries. Optional and additive; present only when the segment has at least minCalibrationObservations
        judgements in the window. Absent means UNKNOWN, never zero.
    GroupLine:
      type: object
      required:
      - catalogItemId
      - quantity
      properties:
        catalogItemId: *id001
        quantity:
          type: integer
          minimum: 1
        ownerRef:
          type: string
          description: The seller (sellerId) whose listing covers the line, chosen by the OwnerChoice rule (ADR 0017).
            Optional and additive; omitted when the line is operator-owned.
    OrderDeadline:
      type: object
      required:
      - tier
      - localTime
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        regionId:
          type: string
          description: Absent means every region.
        localTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    PromiseMadeEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - offerId
            - tier
            - nodeId
            - shipBy
            - deliverByEarliest
            - deliverByLatest
            - basis
            - policyVersion
            - holdExpiresAt
            - lines
            properties:
              promiseId: *id001
              offerId: *id001
              tier:
                $ref: '#/components/schemas/Tier'
              nodeId: *id001
              pickupDepartureId:
                type: string
                description: The witness pickup departure; with nodeId it names the PromiseBook (nodeId:pickupDepartureId).
                  Omitted for a NOMINAL promise, whose witness path carries no departure id (E8).
              shipBy:
                type: string
                format: date-time
                description: The pickup cutoff at the witness node.
              deliverByEarliest: *id002
              deliverByLatest: *id002
              timeZone:
                type: string
                maxLength: 64
                description: IANA time zone of the delivery station serving the destination (e.g. America/Chicago),
                  the local calendar deliverByEarliest/deliverByLatest belong to. Optional and additive (ADR 0011);
                  omitted for a window persisted before it was carried.
              basis:
                $ref: '#/components/schemas/Basis'
              confidence:
                $ref: '#/components/schemas/Confidence'
              policyVersion: *id001
              holdExpiresAt: *id002
              lines:
                type: array
                items:
                  $ref: '#/components/schemas/GroupLine'
                description: The shipment group's lines; always present.
    PromiseConfirmedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
