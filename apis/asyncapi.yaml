    description: 'The integration topic of last-mile-delivery, consumed by the delivery-promise consumer group (DELIVERY_PROMISE_CONSUMER_GROUP).
      Tolerant decoding: unknown types and unknown fields are ignored; every message is deduplicated on the CloudEvents `id`
      in the inbox.'
    messages:
      DeliveryWaveScheduled:
        $ref: '#/components/messages/DeliveryWaveScheduled'
