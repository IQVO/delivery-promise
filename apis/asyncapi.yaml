operations:
  publishDeliveryPromiseEvents:
    action: send
    channel:
      $ref: '#/channels/deliveryPromiseEvents'
    title: Publish delivery-promise events events
    summary: Publish the 6 events events through the transactional outbox.
    description: The service sends PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken, PromiseUnkeepable, PromiseBookExhausted
      to `retailnetwork.delivery-promise.events`. Consumers route on the full `type`.
    tags:
    - name: delivery-promise
    messages:
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseAtRisk'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseRevised'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseKept'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseBroken'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseUnkeepable'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseBookExhausted'
  publishDeliveryPromiseAnalytics:
    action: send
    channel:
      $ref: '#/channels/deliveryPromiseAnalytics'
    title: Publish delivery-promise analytics events
    summary: Publish the 6 analytics events through the transactional outbox.
    description: The service sends PromiseMade, PromiseConfirmed, PromiseReleased, PromiseCancelled, DeliveryOfferQuoted,
      PromisePolicyPublished to `retailnetwork.delivery-promise.analytics`. Consumers route on the full `type`.
    tags:
    - name: delivery-promise
    messages:
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromiseMade'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromiseConfirmed'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromiseReleased'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromiseCancelled'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/DeliveryOfferQuoted'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromisePolicyPublished'
  projectOwnEventsForAnalytics:
    action: receive
    channel:
      $ref: '#/channels/deliveryPromiseEvents'
    title: Project this context's own integration events into the analytical database
    summary: The analytics projector reads back four of the events this service publishes on its integration topic (ADR 0018).
    description: Inbound adapter internal/adapters/inbound/kafka/analytics_consumer.go, run by cmd/dp-projector in the consumer
      group ANALYTICS_CONSUMER_GROUP (default delivery-promise-analytics), the same group as projectOwnAnalyticsForAnalytics.
      Dispatches on the full `type`; PromiseAtRisk and PromiseBookExhausted are acknowledged without projection; any other
      type or a non-CloudEvents message is skipped with a sampled warning; poison goes to retailnetwork.delivery-promise.analytics.dlq.
    tags:
    - name: delivery-promise
    messages:
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseRevised'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseKept'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseBroken'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseUnkeepable'
  projectOwnAnalyticsForAnalytics:
    action: receive
    channel:
      $ref: '#/channels/deliveryPromiseAnalytics'
    title: Project this context's own analytics-only events into the analytical database
    summary: The analytics projector reads back two of the events this service publishes on its analytics topic (ADR 0018).
    description: Inbound adapter internal/adapters/inbound/kafka/analytics_consumer.go, run by cmd/dp-projector in the consumer
      group ANALYTICS_CONSUMER_GROUP (default delivery-promise-analytics), the same group as projectOwnEventsForAnalytics.
      Dispatches on the full `type`; PromiseConfirmed, PromiseReleased, PromiseCancelled and PromisePolicyPublished are
      acknowledged without projection; any other type or a non-CloudEvents message is skipped with a sampled warning.
    tags:
    - name: delivery-promise
    messages:
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/DeliveryOfferQuoted'
    - $ref: '#/channels/deliveryPromiseAnalytics/messages/PromiseMade'
  receiveCustomerOrderingEvents:
    action: receive
    channel:
      $ref: '#/channels/customerOrderingEvents'
    title: Consume customer-ordering events
    summary: Consume CustomerOrderPlaced, CustomerOrderCancelled from customer-ordering.
    description: The service consumes CustomerOrderPlaced, CustomerOrderCancelled from `retailnetwork.customer-ordering.events`
      to keep its local read models and to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls customer-ordering
      synchronously.
    tags:
    - name: consumed-customer-ordering
    messages:
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderPlaced'
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderCancelled'
  receiveOrderSourcingEvents:
    action: receive
    channel:
      $ref: '#/channels/orderSourcingEvents'
    title: Consume order-sourcing events
    summary: Consume FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable from order-sourcing.
    description: The service consumes FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable from `retailnetwork.order-sourcing.events`
      to keep its local read models and to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls order-sourcing
      synchronously.
    tags:
    - name: consumed-order-sourcing
    messages:
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentLocked'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentShipped'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentUnsourceable'
  receiveShippingAndTrackingEvents:
    action: receive
    channel:
      $ref: '#/channels/shippingAndTrackingEvents'
    title: Consume shipping-and-tracking events
    summary: Consume PackageDelivered, PackageExceptionRaised, PackageLost, PackageReturned from shipping-and-tracking.
    description: The service consumes PackageDelivered, PackageExceptionRaised, PackageLost, PackageReturned from `retailnetwork.shipping-and-tracking.events`
      to keep its local read models and to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls shipping-and-tracking
      synchronously.
    tags:
    - name: consumed-shipping-and-tracking
    messages:
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageDelivered'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageExceptionRaised'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageLost'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageReturned'
  receiveLinehaulEvents:
    action: receive
    channel:
      $ref: '#/channels/linehaulEvents'
    title: Consume linehaul-transportation events
    summary: Consume DepartureScheduled, DepartureCapacityChanged, DepartureCancelled, BookingMoved, BookingFailed, LoadDeparted,
      LoadArrived from linehaul-transportation.
    description: The service consumes DepartureScheduled, DepartureCapacityChanged, DepartureCancelled, BookingMoved, BookingFailed,
      LoadDeparted and LoadArrived from `retailnetwork.linehaul-transportation.events` to keep its local read models (the
      load events pair by loadId into the measured-transit read model, ADR 0014, and LoadArrived records the arrival of its
      departureId, when it carries one, for the late-risk sweep, ADR 0021) and to drive RepromiseOnRisk, JudgeOnDelivery
      and CancelPromise. It never calls linehaul-transportation synchronously.
    tags:
    - name: consumed-linehaul-transportation
    messages:
    - $ref: '#/channels/linehaulEvents/messages/DepartureScheduled'
    - $ref: '#/channels/linehaulEvents/messages/DepartureCapacityChanged'
    - $ref: '#/channels/linehaulEvents/messages/DepartureCancelled'
    - $ref: '#/channels/linehaulEvents/messages/BookingMoved'
    - $ref: '#/channels/linehaulEvents/messages/BookingFailed'
    - $ref: '#/channels/linehaulEvents/messages/LoadDeparted'
    - $ref: '#/channels/linehaulEvents/messages/LoadArrived'
  receiveLastMileEvents:
    action: receive
    channel:
      $ref: '#/channels/lastMileEvents'
    title: Consume last-mile-delivery events
    summary: Consume DeliveryWaveScheduled, DeliveryWaveCapacityChanged, DeliveryWaveCancelled, PackageInductionDeferred from
      last-mile-delivery.
    description: The service consumes DeliveryWaveScheduled, DeliveryWaveCapacityChanged, DeliveryWaveCancelled, PackageInductionDeferred
      from `retailnetwork.last-mile-delivery.events` to keep its local read models and to drive RepromiseOnRisk, JudgeOnDelivery
      and CancelPromise. It never calls last-mile-delivery synchronously.
    tags:
    - name: consumed-last-mile-delivery
    messages:
    - $ref: '#/channels/lastMileEvents/messages/DeliveryWaveScheduled'
    - $ref: '#/channels/lastMileEvents/messages/DeliveryWaveCapacityChanged'
    - $ref: '#/channels/lastMileEvents/messages/DeliveryWaveCancelled'
    - $ref: '#/channels/lastMileEvents/messages/PackageInductionDeferred'
  receiveNodePerformanceEvents:
    action: receive
    channel:
      $ref: '#/channels/nodePerformanceEvents'
    title: Consume node-performance events
    summary: Consume NodeScorecardUpdated, NodeTierEligibilityChanged from node-performance.
    description: The service consumes NodeScorecardUpdated, NodeTierEligibilityChanged from `retailnetwork.node-performance.events`
      to keep its local read models and to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls node-performance
      synchronously.
    tags:
    - name: consumed-node-performance
    messages:
    - $ref: '#/channels/nodePerformanceEvents/messages/NodeScorecardUpdated'
    - $ref: '#/channels/nodePerformanceEvents/messages/NodeTierEligibilityChanged'
  receiveNodeTopologyEvents:
    action: receive
    channel:
      $ref: '#/channels/nodeTopologyEvents'
    title: Consume node-topology events
    summary: Consume NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired, LaneOpened,
      LaneClosed, ServiceAreaAssigned, RegionDefined from node-topology.
    description: The service consumes NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended, NodeRetired,
      LaneOpened, LaneClosed, ServiceAreaAssigned, RegionDefined from `retailnetwork.node-topology.events` to keep its local
      read models and to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls node-topology synchronously.
    tags:
    - name: consumed-node-topology
    messages:
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRegistered'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeOperationalProfileDeclared'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeActivated'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeSuspended'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRetired'
    - $ref: '#/channels/nodeTopologyEvents/messages/LaneOpened'
    - $ref: '#/channels/nodeTopologyEvents/messages/LaneClosed'
    - $ref: '#/channels/nodeTopologyEvents/messages/ServiceAreaAssigned'
    - $ref: '#/channels/nodeTopologyEvents/messages/RegionDefined'
  receiveOfferAvailabilityEvents:
    action: receive
    channel:
      $ref: '#/channels/offerAvailabilityEvents'
    title: Consume offer-availability events
    summary: Consume CatalogItemCreated, CatalogItemDiscontinued, ListingCreated, ListingAvailabilityChanged, ListingSuppressed,
      ListingRestored from offer-availability.
    description: The service consumes CatalogItemCreated, CatalogItemDiscontinued, ListingCreated, ListingAvailabilityChanged,
      ListingSuppressed, ListingRestored from `retailnetwork.offer-availability.events` to keep its local read models and
      to drive RepromiseOnRisk, JudgeOnDelivery and CancelPromise. It never calls offer-availability synchronously.
    tags:
    - name: consumed-offer-availability
    messages:
    - $ref: '#/channels/offerAvailabilityEvents/messages/CatalogItemCreated'
    - $ref: '#/channels/offerAvailabilityEvents/messages/CatalogItemDiscontinued'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingCreated'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingAvailabilityChanged'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingSuppressed'
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingRestored'
components:
  messages:
    PromiseMade:
      name: PromiseMade
      title: Promise made
      summary: A provisional promise was made for one shipment group and capacity was held.
      contentType: application/cloudevents+json
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseMade`; `dataschema` = `urn:retailnetwork:delivery-promise:analytics:PromiseMade:v1`;
        subject and key = the promiseId. Topic: retailnetwork.delivery-promise.analytics. Raised by MakePromise. ANALYTICS
        ONLY (model: consumers analytics only). The offer is CONSUMED and the book hold taken in the same transaction. `lines`
        always has at least one entry.'
      tags:
      - name: promise
      payload:
        $ref: '#/components/schemas/PromiseMadeEvent'
      examples:
      - name: promiseMade
        summary: A provisional promise was made for one shipment group and capacity was held.
        payload:
          specversion: '1.0'
          id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0001
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseMade
          subject: prm-7f3a21
          time: '2026-10-22T19:09:00Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:analytics:PromiseMade:v1
          data:
            promiseId: prm-7f3a21
            offerId: off-19c4d0
            tier: NEXT_DAY
            nodeId: N-VWS-AUS3
            pickupDepartureId: dep-AUS3-1800
            shipBy: '2026-10-22T23:00:00Z'
            deliverByEarliest: '2026-10-23T14:00:00Z'
            deliverByLatest: '2026-10-24T02:00:00Z'
            timeZone: America/Chicago
            basis: SCHEDULED
            confidence: 0.973
            policyVersion: v3
            holdExpiresAt: '2026-10-22T19:24:00Z'
            lines:
            - catalogItemId: ci-1001
              quantity: 2
    PromiseConfirmed:
      name: PromiseConfirmed
      title: Promise confirmed
      summary: A provisional promise became CONFIRMED for a placed order.
