  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          const: /retailnetwork/delivery-promise
        type: &id001
          type: string
        subject:
          type: string
          description: The aggregate root id (promiseId, bookId, offerId or policyVersion).
        time: &id002
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema: *id001
    ConsumedEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - time
      - data
      description: 'Tolerant envelope of a consumed event: only the attributes the consumer relies on.'
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source: *id001
        type: *id001
        subject: *id001
        time: *id002
        datacontenttype: *id001
        dataschema: *id001
    Tier:
      type: string
      enum:
      - SAME_DAY
      - NEXT_DAY
      - TWO_DAY
      - STANDARD
    Basis:
      type: string
      enum:
      - SCHEDULED
      - NOMINAL
    GroupLine:
      type: object
      required:
      - catalogItemId
      - quantity
      properties:
        catalogItemId: *id001
        quantity:
          type: integer
          minimum: 1
    OrderDeadline:
      type: object
      required:
      - tier
      - localTime
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        regionId:
          type: string
          description: Absent means every region.
        localTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    PromiseMadeEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - offerId
            - tier
            - nodeId
            - shipBy
            - deliverByEarliest
            - deliverByLatest
            - basis
            - policyVersion
            - holdExpiresAt
            - lines
            properties:
              promiseId: *id001
              offerId: *id001
              tier:
                $ref: '#/components/schemas/Tier'
              nodeId: *id001
              pickupDepartureId:
                type: string
                description: The witness pickup departure; with nodeId it names the PromiseBook (nodeId:pickupDepartureId).
                  Omitted for a NOMINAL promise, whose witness path carries no departure id (E8).
              shipBy:
                type: string
                format: date-time
                description: The pickup cutoff at the witness node.
              deliverByEarliest: *id002
              deliverByLatest: *id002
              timeZone:
                type: string
                maxLength: 64
                description: IANA time zone of the delivery station serving the destination (e.g. America/Chicago),
                  the local calendar deliverByEarliest/deliverByLatest belong to. Optional and additive (ADR 0011);
                  omitted for a window persisted before it was carried.
              basis:
                $ref: '#/components/schemas/Basis'
              policyVersion: *id001
              holdExpiresAt: *id002
              lines:
                type: array
                items:
                  $ref: '#/components/schemas/GroupLine'
                description: The shipment group's lines; always present.
    PromiseConfirmedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - orderId
            - groupNo
            properties:
              promiseId: *id001
              orderId: *id001
              groupNo:
                type: integer
                description: Shipment group number within the order, from 1.
    PromiseAtRiskEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - orderId
            - reason
            - detectedAt
            properties:
              promiseId: *id001
              orderId: *id001
              reason: *id001
              detectedAt: *id002
    PromiseRevisedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - orderId
            - revisionNo
            - previousDeliverByLatest
            - deliverByEarliest
            - deliverByLatest
            - shipBy
            - nodeId
            - reason
            properties:
              promiseId: *id001
              orderId: *id001
              revisionNo:
                type: integer
                minimum: 1
                description: Strictly increasing per promise.
              previousDeliverByLatest: *id002
              deliverByEarliest: *id002
              deliverByLatest: *id002
              timeZone:
                type: string
                maxLength: 64
                description: IANA time zone of the delivery station serving the destination (e.g. America/Chicago),
                  the local calendar deliverByEarliest/deliverByLatest belong to. Optional and additive (ADR 0011);
                  omitted for a window persisted before it was carried.
              shipBy: *id002
              nodeId: *id001
              reason: *id001
    PromiseKeptEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - orderId
            - nodeId
            - deliveredAt
            - deliverByLatest
            properties:
              promiseId: *id001
              orderId: *id001
              nodeId: *id001
              deliveredAt: *id002
              deliverByLatest: *id002
    PromiseBrokenEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - promiseId
            - orderId
            - nodeId
            - deliverByLatest
            - lateByMinutes
            - cause
            properties:
              promiseId: *id001
              orderId: *id001
              nodeId: *id001
              deliveredAt:
                type: string
                format: date-time
                description: Omitted for cause LOST and RETURNED.
              deliverByLatest: *id002
              lateByMinutes:
                type: integer
                minimum: 0
              cause:
                type: string
                enum:
                - LATE
                - LOST
                - RETURNED
    PromiseReleasedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
