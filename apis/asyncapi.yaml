asyncapi: 3.0.0
info:
  title: delivery-promise Domain Events
  version: 1.2.0
  description: 'Event catalog for the **delivery-promise** bounded context of the retail network (commerce tier, Core): it
    quotes delivery offers from a feasible witness path, holds capacity in PromiseBooks, makes and judges promises (ADR 0002,
    ADR 0003).


    **Published.** Twelve events through a **transactional outbox** (the aggregate rows and the already-encoded events are
    written in ONE database transaction and an always-on relay drains them to Kafka, at-least-once, the CloudEvents `id` is
    stored with the outbox row). Six integration events go to `retailnetwork.delivery-promise.events` (PromiseAtRisk, PromiseRevised,
    PromiseKept, PromiseBroken, PromiseUnkeepable, PromiseBookExhausted); six analytics-only events go ONLY to `retailnetwork.delivery-promise.analytics`
    (PromiseMade, PromiseConfirmed, PromiseReleased, PromiseCancelled, DeliveryOfferQuoted, PromisePolicyPublished). The types
    are catalogued in ADR 0004.


    **Consumed.** Events of eight producers, kept as event-fed local read models or driving RepromiseOnRisk, JudgeOnDelivery
    and CancelPromise (ADR 0003). The consumed messages below are a tolerant local copy of the fields this service relies
    on; the producer''s own AsyncAPI is authoritative. Every consumer is idempotent on the CloudEvents `id` (inbox table)
    and dispatches on the full `type`. A transient failure is retried with capped backoff (5 attempts), then the message goes to `<topic>.dlq`
    (headers `x-dlq-*`); a payload that can never be applied goes there at once; an unknown type or a message that is not a valid CloudEvent
    is logged and skipped. Offsets are committed only after handling.


    **Own events, read back for analytics (ADR 0018).** The analytics projector (`cmd/dp-projector`) reads this context''s
    OWN two topics in the fixed group `delivery-promise-analytics` and projects DeliveryOfferQuoted and PromiseMade (from
    `.analytics`) and PromiseRevised, PromiseUnkeepable, PromiseKept and PromiseBroken (from `.events`) into a separate
    analytical database. It dedupes on the CloudEvents `id` in the same transaction as the projection, dead-letters only
    deterministic poison to `retailnetwork.delivery-promise.analytics.dlq` and retries transient failures without a bound.
    It reads no sibling''s topic.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json;
    charset=UTF-8`. `specversion`, `id`, `source` (`/retailnetwork/delivery-promise`), `type`, `subject` (the aggregate root
    id), `time`, `datacontenttype` (`application/json`) and `dataschema` (`urn:retailnetwork:delivery-promise:<stream>:<EventName>:v1`)
    are all required. Kafka key = the subject. Type = `com.retailnetwork.commerce.delivery-promise.<entity>.<EventName>` with
    entity `promise`, `promisebook`, `deliveryoffer` or `promisepolicy`. A breaking payload change is a new `.v2` type, never
    a mutation.


    **Conventions.** `data` is camelCase; ids are strings; instants are RFC 3339 UTC; optional fields are omitted when unset
    (never null); arrays are always present.'
  contact:
    name: delivery-promise maintainers
    url: https://github.com/IQVO/delivery-promise
    email: delivery-promise@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: delivery-promise
    description: The delivery-promise bounded context (retail network, commerce tier).
  - name: promise
    description: Events raised by the promise aggregate.
  - name: promisebook
    description: Events raised by the promisebook aggregate.
  - name: deliveryoffer
    description: Events raised by the deliveryoffer aggregate.
  - name: promisepolicy
    description: Events raised by the promisepolicy aggregate.
  - name: consumed-customer-ordering
    description: Events consumed from customer-ordering.
  - name: consumed-last-mile-delivery
    description: Events consumed from last-mile-delivery.
  - name: consumed-linehaul-transportation
    description: Events consumed from linehaul-transportation.
  - name: consumed-node-performance
    description: Events consumed from node-performance.
  - name: consumed-node-topology
    description: Events consumed from node-topology.
  - name: consumed-offer-availability
    description: Events consumed from offer-availability.
  - name: consumed-order-sourcing
    description: Events consumed from order-sourcing.
  - name: consumed-shipping-and-tracking
    description: Events consumed from shipping-and-tracking.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  deliveryPromiseEvents:
    address: retailnetwork.delivery-promise.events
    title: delivery-promise integration topic
    description: This service's integration topic. Written by the outbox relay; key = subject. Every message carries the CloudEvents
      content-type header. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      PromiseAtRisk:
        $ref: '#/components/messages/PromiseAtRisk'
      PromiseRevised:
        $ref: '#/components/messages/PromiseRevised'
      PromiseKept:
        $ref: '#/components/messages/PromiseKept'
      PromiseBroken:
        $ref: '#/components/messages/PromiseBroken'
      PromiseUnkeepable:
        $ref: '#/components/messages/PromiseUnkeepable'
      PromiseBookExhausted:
        $ref: '#/components/messages/PromiseBookExhausted'
  deliveryPromiseAnalytics:
    address: retailnetwork.delivery-promise.analytics
    title: delivery-promise analytics topic
    description: 'This service''s analytics-only topic: events no other context consumes. Written by the outbox relay; key
      = subject. Every message carries the CloudEvents content-type header. Dispatch on the full `type`, ignore unknown types,
      dedupe on `id`.'
    messages:
      PromiseMade:
        $ref: '#/components/messages/PromiseMade'
      PromiseConfirmed:
        $ref: '#/components/messages/PromiseConfirmed'
      PromiseReleased:
        $ref: '#/components/messages/PromiseReleased'
      PromiseCancelled:
        $ref: '#/components/messages/PromiseCancelled'
      DeliveryOfferQuoted:
        $ref: '#/components/messages/DeliveryOfferQuoted'
      PromisePolicyPublished:
        $ref: '#/components/messages/PromisePolicyPublished'
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic (consumed)
    description: 'The integration topic of customer-ordering, consumed by the delivery-promise consumer group (DELIVERY_PROMISE_CONSUMER_GROUP).
      Tolerant decoding: unknown types and unknown fields are ignored; every message is deduplicated on the CloudEvents `id`
      in the inbox.'
    messages:
      CustomerOrderPlaced:
        $ref: '#/components/messages/CustomerOrderPlaced'
      CustomerOrderCancelled:
        $ref: '#/components/messages/CustomerOrderCancelled'
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic (consumed)
    description: 'The integration topic of order-sourcing, consumed by the delivery-promise consumer group (DELIVERY_PROMISE_CONSUMER_GROUP).
      Tolerant decoding: unknown types and unknown fields are ignored; every message is deduplicated on the CloudEvents `id`
      in the inbox.'
    messages:
      FulfillmentLocked:
        $ref: '#/components/messages/FulfillmentLocked'
      FulfillmentShipped:
        $ref: '#/components/messages/FulfillmentShipped'
      FulfillmentUnsourceable:
